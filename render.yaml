services:
  - type: web
    name: sentinel-lews
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FAST2SMS_KEY
        sync: false
      - key: PORT
        value: 10000
