name: Build & Release Sentinel Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Capacitor Web Assets
        run: |
          npm install
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK Output
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/sentinel-citizen.apk
          ls -lh build_output/sentinel-citizen.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-citizen-apk
          path: build_output/sentinel-citizen.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "SENTINEL Citizen Android APK v1.0.0"
          body: "Official Android APK build for SENTINEL Citizen Landslide Early Warning & Navigation System."
          files: build_output/sentinel-citizen.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
